<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>«Балапан» — Яркий (демо)</title><link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--teal:#2bb3a3;--yel:#f6c343;--cor:#f2785c;--vio:#7b8de0;--ink:#24313b;--bg:#fff7e6}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;font:17px/1.55 Nunito,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:76px}img{display:block;max-width:100%}a{color:inherit}
.wrap{max-width:1200px;margin:auto;padding:0 18px}
header{position:fixed;top:12px;left:12px;right:12px;z-index:30;display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:8px 10px 8px 12px;box-shadow:0 10px 30px rgba(242,120,92,.18);max-width:1200px;margin:auto}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex:none;font-weight:900;font-size:20px}.logo img{width:42px;height:42px}
nav{flex:1;display:flex;justify-content:center;gap:6px;min-width:0;overflow:hidden;height:40px;flex-wrap:wrap}
nav a{text-decoration:none;font-weight:800;padding:8px 14px;border-radius:999px;white-space:nowrap;font-size:15px}nav a:nth-child(4n+1){background:#fff1c9}nav a:nth-child(4n+2){background:#ffe0d8}nav a:nth-child(4n+3){background:#d7f3ef}nav a:nth-child(4n){background:#e3e7fb}
.lang{display:flex;background:#f3f3f3;border-radius:999px;padding:3px;flex:none;margin-left:auto}.lang button{border:0;background:none;border-radius:999px;padding:7px 12px;font:800 14px Nunito,sans-serif;cursor:pointer}.lang [aria-pressed=true]{background:var(--cor);color:#fff}
.tabs{display:none}
/* mobile: bottom tab bar instead of top menu */
.mob nav{display:none}.mob .tabs{display:flex;position:fixed;bottom:10px;left:10px;right:10px;z-index:30;background:#fff;border-radius:24px;box-shadow:0 -4px 24px rgba(0,0,0,.12);padding:6px;overflow-x:auto;gap:4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;text-decoration:none;font-size:11px;font-weight:800;padding:6px 8px;border-radius:16px;min-width:64px}.tabs a i{font-style:normal;font-size:22px}.tabs a.on{background:#fff1c9}
.hero{--heroimg:url(hero.jpg);position:relative;min-height:92vh;display:flex;align-items:flex-end;padding:110px 0 40px;background:url(hero.jpg) center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(36,49,59,.55))}
.hcard{position:relative;z-index:1;background:#fff;border-radius:40px 40px 40px 8px;padding:26px 28px;max-width:560px;box-shadow:0 20px 40px rgba(0,0,0,.2)}.hcard h1{margin:0 0 8px;font-size:clamp(30px,6vw,52px);line-height:1.05;font-weight:900}.hcard h1 em{color:var(--cor);font-style:normal}
.demo{display:inline-block;background:var(--yel);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:800;margin-bottom:10px}
.btn{display:inline-block;margin:8px 8px 0 0;padding:13px 22px;border-radius:999px;font-weight:900;text-decoration:none}.b1{background:var(--teal);color:#fff}.b2{background:#fff1c9}
section{padding:56px 0}h2{font-size:clamp(28px,5vw,42px);font-weight:900;margin:0 0 22px;display:flex;align-items:center;gap:12px}h2 i{font-style:normal;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;transform:rotate(-6deg)}
.mosaic{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}.mosaic img{width:100%;height:100%;object-fit:cover;border-radius:28px}.mosaic img:first-child{grid-column:span 2;grid-row:span 2}
@media(min-width:800px){.mosaic{grid-template-columns:repeat(4,1fr);grid-auto-rows:200px}.mosaic img:first-child{grid-column:span 2;grid-row:span 2}.mosaic img:nth-child(4){grid-column:span 2}}
.tiles{list-style:none;padding:0;margin:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.tiles.g li{background:var(--c);color:#fff;border-radius:36px;padding:26px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.tiles.g .ge{position:absolute;top:14px;right:18px;font-size:64px}.tiles.g b{font-size:28px;font-weight:900}
.feat li,.stf li{background:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.05)}.fi{font-size:34px}
.stf li{align-items:center;text-align:center}.av{width:84px;height:84px;border-radius:40% 60% 55% 45%;display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;margin-bottom:8px}.stf li:nth-child(4n+1) .av{background:var(--cor)}.stf li:nth-child(4n+2) .av{background:var(--teal)}.stf li:nth-child(4n+3) .av{background:var(--yel)}.stf li:nth-child(4n) .av{background:var(--vio)}
.nws{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.nws article{flex:0 0 min(320px,85%);scroll-snap-align:start;background:#fff;border-radius:32px;overflow:hidden}.nws img{aspect-ratio:4/3;object-fit:cover;width:100%}.nws div{padding:16px 20px}.nws time{background:#ffe0d8;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}.nws h3{margin:8px 0 4px}
.dcs{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:10px}.dcs li{background:#fff;border-radius:999px;padding:12px 18px;font-weight:800}.dcs a{text-decoration:none}.dcs small{margin-left:6px;color:#999}
.sym li{background:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px}.sym svg{width:100px;height:64px}
.cnt{background:var(--teal);color:#fff;border-radius:40px;padding:30px}.cnt a{color:#fff}dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0 0 10px}dt{font-weight:900}dd{margin:0}
footer{text-align:center;padding:20px;font-size:14px;opacity:.7}
@media(max-width:1023px){.hero{display:block;min-height:0;padding:0 0 8px;background:none}.hero:before{content:"";display:block;aspect-ratio:4/3;max-height:68vh;width:100%;background:var(--heroimg) center 60%/cover}.hero:after{display:none}.hero .wrap{position:relative;z-index:1}.hcard{margin:-36px auto 0;max-width:640px;padding:16px 20px;border-radius:28px 28px 28px 8px}.hcard h1{font-size:clamp(24px,5vw,38px)}.hcard .btn{padding:9px 16px;font-size:14px}}@media(max-width:480px){.hcard p{display:none}}@media(max-width:520px){.tabs a{flex:1 1 0;min-width:0;padding:5px 1px;font-size:10px;letter-spacing:-.2px;white-space:nowrap}.tabs a i{font-size:20px}}@media(min-width:1024px){.hero{background:var(--heroimg) right center/auto 100% no-repeat,linear-gradient(135deg,#fff1c9,#e1ecf8);align-items:center}.hero:after{background:linear-gradient(90deg,rgba(255,248,235,.0) 0,rgba(0,0,0,0) 100%)}}</style></head><body>
<header><a class="logo" href="#top"><img src="logo.svg" alt=""><span data-t="brand"></span></a><nav id="nav"></nav><span id="lang"></span></header>
<div class="tabs" id="tabs"></div>
<main id="top">
<section class="hero"><div class="wrap"><div class="hcard"><span class="demo" data-t="demo"></span><h1 id="h1"></h1><p data-t="heroL"></p><a class="btn b1" href="https://wa.me/77000000000" data-t="wa"></a><a class="btn b2" href="tel:+77000000000" data-t="call"></a></div></div></section>
<section><div class="wrap"><h2><i style="background:#ffe0d8">📸</i><span data-t="gallery"></span></h2><div class="mosaic"><img src="play.jpg" alt=""><img src="art.jpg" alt=""><img src="yard.jpg" alt=""><img src="hero.jpg" alt=""></div></div></section>
<section id="groups"><div class="wrap"><h2><i style="background:#fff1c9">🧸</i><span data-n="groups"></span></h2><ul class="tiles g" id="grp"></ul></div></section>
<section id="about"><div class="wrap"><h2><i style="background:#d7f3ef">🏡</i><span data-n="about"></span></h2><p data-t="aboutP"></p><ul class="tiles feat" id="feats"></ul></div></section>
<section id="news"><div class="wrap"><h2><i style="background:#ffe0d8">📰</i><span data-n="news"></span></h2><div class="nws" id="nws"></div></div></section>
<section id="staff"><div class="wrap"><h2><i style="background:#e3e7fb">👩‍🏫</i><span data-n="staff"></span></h2><ul class="tiles stf" id="stf"></ul></div></section>
<section id="docs"><div class="wrap"><h2><i style="background:#fff1c9">📁</i><span data-n="docs"></span></h2><ul class="dcs" id="dcs"></ul><p data-t="docsNote" style="opacity:.7;font-size:14px"></p></div></section>
<section id="symbols"><div class="wrap"><h2><i style="background:#d7f3ef">🇰🇿</i><span data-t="symT"></span></h2><ul class="tiles sym" id="sym"></ul></div></section>
<section id="contacts"><div class="wrap"><h2><i style="background:#ffe0d8">📞</i><span data-n="contacts"></span></h2><div class="cnt" id="cnt"></div></div></section>
</main><footer data-t="foot"></footer>
<script src="data.js"></script><script src="render.js"></script><script>
const $=id=>document.getElementById(id),R=document.documentElement,IC={about:'🏡',groups:'🧸',staff:'👩‍🏫',news:'📰',docs:'📁',symbols:'🇰🇿',contacts:'📞'};
function fit(){R.classList.remove('mob');if(innerWidth<1000){R.classList.add('mob');return}fitNav($('nav'),'mob')}
window.render=()=>{S.i18n();document.querySelectorAll('[data-n]').forEach(e=>e.textContent=S.title(e.dataset.n));$('h1').innerHTML=L()?'Детский сад <em>«Балапан»</em>':'<em>«Балапан»</em> балабақшасы';$('nav').innerHTML=S.nav();$('tabs').innerHTML=D.nav.map(n=>`<a href="#${n[0]}"><i>${IC[n[0]]}</i>${n[1+L()]}</a>`).join('');$('lang').innerHTML=S.lang();$('feats').innerHTML=S.feats();$('grp').innerHTML=S.groups();$('stf').innerHTML=S.staff();$('nws').innerHTML=S.news();$('dcs').innerHTML=S.docs();$('sym').innerHTML=S.sym();$('cnt').innerHTML=S.contacts();document.title=T('heroT')+' — демо';fit()};
render();addEventListener('resize',fit);addEventListener('load',fit);document.fonts&&document.fonts.ready.then(fit);
</script></body></html>
